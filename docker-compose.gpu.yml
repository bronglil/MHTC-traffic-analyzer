# NVIDIA GPU for the worker (much faster on long videos). Needs the NVIDIA driver and,
# on Linux, the NVIDIA Container Toolkit; Docker Desktop on Windows needs WSL 2 GPU support.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  worker:
    build:
      context: ./backend
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    image: traffic-vision-backend-gpu:latest
    environment:
      TV_DEVICE: "cuda:0"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
