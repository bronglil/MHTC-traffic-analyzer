# Traffic Vision: PostgreSQL + API + background worker + web UI.
#   docker compose up --build      ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic_vision
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic_vision"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    image: traffic-vision-backend:latest
    environment: &backend-env
      TV_DATABASE_URL: postgresql+psycopg://traffic:traffic@db:5432/traffic_vision
      TV_DATA_DIR: /data
      TV_EMBEDDED_WORKER: "false"
      TV_CORS_ORIGINS: '["http://localhost:8080"]'
      # Videos copied into ./videos (next to this file) can be imported without uploading.
      TV_IMPORT_DIR: /videos
      # TV_MODEL_PATH: mhtc-vehicles.pt        # custom detector in /data/models (default: yolo11n.pt baked in)
      # TV_CLASSIFIER_MODEL: mhtc-vehicle-cls.pt
    volumes: [data:/data, ./videos:/videos:ro]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ./backend                       # same image as the API; the second build is a cache hit
    image: traffic-vision-backend:latest
    command: ["python", "-m", "app.workers.worker"]
    environment: *backend-env
    volumes: [data:/data, ./videos:/videos:ro]
    depends_on:
      db: {condition: service_healthy}
    # Batches run one video at a time per worker. Several videos at once:
    #   docker compose up -d --scale worker=2
    # (each worker uses all CPU cores, so more than 2 rarely helps without a GPU).
    # NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

  web:
    build: ./frontend
    image: traffic-vision-web:latest
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  data:
